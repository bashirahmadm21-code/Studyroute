<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - StudyRoute</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Contact Us</h1>
        <p>We'd love to hear from you!</p>
    </header>

    <main>
        <section>
            <h2>Get in Touch</h2>

            <p>
                If you have any questions, suggestions, feedback, or notice
                an issue on StudyRoute, feel free to contact us.
            </p>

            <form action="https://formsubmit.co/YOUR_EMAIL@example.com" method="POST">

                <input type="hidden" name="_subject" value="New Contact Message - StudyRoute">
                <input type="hidden" name="_captcha" value="false">

                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <button type="submit">Send Message</button>

            </form>
        </section>
    </main>

</body>
</html>
